spring.application.name=salonflow
# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.ignore-missing-migrations=true
spring.flyway.validate-on-migrate=false
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=password123
minio.bucket-name=salon-images
# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.co.elastic.clients=DEBUG
logging.level.org.elasticsearch.client=TRACE
logging.level.tracer=TRACE
#JWT
jwt.secret=MyVeryStrongSecretKeyForSalonFlowProjectJWT2026SecurityKey
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.reset-password-expiration=1800000

# EMAIL (RESEND)
mail.provider=resend
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
app.notification.email.enabled=false

# FCM Web Push
# Bật true khi đã có Firebase service account JSON hoặc path
app.notification.fcm.enabled=true
app.notification.fcm.project-id=salonflow-a669d
app.notification.fcm.service-account-path=classpath:salonflow-a669d-firebase-adminsdk-fbsvc-df4d0bc1de.json
app.notification.fcm.web-link=${frontend.url}

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile


server.port=9090
frontend.url=http://localhost:5173

# VNPay Config
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_URL}
vnpay.api-url=${VNPAY_API_URL}
