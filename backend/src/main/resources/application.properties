spring.application.name=salonflow
# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.ignore-missing-migrations=true
spring.flyway.validate-on-migrate=false
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=password123
minio.bucket-name=salon-images
# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.co.elastic.clients=DEBUG
logging.level.org.elasticsearch.client=TRACE
logging.level.tracer=TRACE
#JWT
jwt.secret=MyVeryStrongSecretKeyForSalonFlowProjectJWT2026SecurityKey
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.reset-password-expiration=1800000

# EMAIL (RESEND)
mail.provider=resend
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile


