# ============================================================
# SALONFLOW - APPLICATION CONFIGURATION
# Environment variables are used for all environment-specific
# configuration, credentials, secrets and external URLs.
# ============================================================


# ============================================================
# APPLICATION
# ============================================================
spring.application.name=${SPRING_APPLICATION_NAME:salonflow}


# ============================================================
# DATABASE - POSTGRESQL
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}


# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}


# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.ignore-missing-migrations=${FLYWAY_IGNORE_MISSING_MIGRATIONS:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}


# ============================================================
# REDIS
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}


# ============================================================
# MINIO
# ============================================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME:salon-images}


# ============================================================
# ELASTICSEARCH
# ============================================================
spring.elasticsearch.uris=${ELASTICSEARCH_URI:http://localhost:9200}

logging.level.org.springframework.data.elasticsearch=${ELASTICSEARCH_LOG_LEVEL:INFO}
logging.level.co.elastic.clients=${ELASTICSEARCH_CLIENT_LOG_LEVEL:INFO}
logging.level.org.elasticsearch.client=${ELASTICSEARCH_CLIENT_TRACE_LEVEL:INFO}
logging.level.tracer=${TRACER_LOG_LEVEL:INFO}


# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
jwt.reset-password-expiration=${JWT_RESET_PASSWORD_EXPIRATION:1800000}

booking.qr.secret=${BOOKING_QR_SECRET:${JWT_SECRET}}


# ============================================================
# EMAIL - RESEND / SENDGRID
# ============================================================
app.notification.email.enabled=${EMAIL_NOTIFICATION_ENABLED:true}

mail.primary-provider=${MAIL_PROVIDER:resend}
mail.fallback-provider=${MAIL_FALLBACK_PROVIDER:sendgrid}
mail.max-retries=${MAIL_MAX_RETRIES:3}

resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from=${SENDGRID_FROM:}


# ============================================================
# OAUTH2 - GOOGLE
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH_SCOPE:openid,email,profile}

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:9090}

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

frontend.url=${FRONTEND_URL:http://localhost:5173}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# ============================================================
# VNPAY
# ============================================================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}

vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

vnpay.pay-url=${VNPAY_PAY_URL:${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}}

vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}


# ============================================================
# ZALOPAY
# ============================================================
zalopay.app-id=${ZALOPAY_APP_ID}
zalopay.key-1=${ZALOPAY_KEY_1}
zalopay.key-2=${ZALOPAY_KEY_2}
zalopay.url=${ZALOPAY_URL:https://sb-openapi.zalopay.vn/v2/create}


# ============================================================
# AI - CORE
# ============================================================
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:openai}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_API_KEY}

app.ai.default-model=${AI_DEFAULT_MODEL:gpt-4.1-mini}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:text-embedding-3-small}

app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:800}
app.ai.temperature=${AI_TEMPERATURE:0.3}
app.ai.rag-top-k=${AI_RAG_TOP_K:5}
app.ai.conversation-ttl-minutes=${AI_CONVERSATION_TTL_MINUTES:1440}


# ============================================================
# AI - REVIEW SENTIMENT
# ============================================================
app.ai.review.enabled=${AI_REVIEW_ENABLED:true}
app.ai.review.provider=${AI_REVIEW_PROVIDER:openai}

app.ai.review.openai-model=${AI_REVIEW_OPENAI_MODEL:gpt-4.1-mini}

app.ai.review.openai-system-prompt=${AI_REVIEW_OPENAI_SYSTEM_PROMPT:You are a sentiment classifier for salon reviews. Classify the given review into exactly one of: positive, neutral, negative. Return JSON only with keys sentiment and confidence. sentiment must be lowercase. confidence must be a number between 0 and 1.}

app.ai.review.batch-size=${AI_REVIEW_BATCH_SIZE:20}
app.ai.review.scan-interval-ms=${AI_REVIEW_SCAN_INTERVAL_MS:1800000}
app.ai.review.low-confidence-threshold=${AI_REVIEW_LOW_CONFIDENCE_THRESHOLD:0.55}


# ============================================================
# ESMS - SMS
# ============================================================
esms.api-key=${ESMS_API_KEY:}
esms.secret-key=${ESMS_SECRET_KEY:}
esms.brand-name=${ESMS_BRAND_NAME:Baotrixemay}

esms.api-url=${ESMS_API_URL:https://rest.esms.vn/MainService.svc/json/SendMultipleMessage_V4_post_json/}

esms.sms-type=${ESMS_SMS_TYPE:2}
esms.mock-enable=${ESMS_MOCK_ENABLE:false}


# ============================================================
# AI - HAIR ANALYSIS
# ============================================================
app.ai.hair.enabled=${AI_HAIR_ENABLED:true}
app.ai.hair.provider=${AI_HAIR_PROVIDER:openai}

app.ai.hair.openai-model=${AI_HAIR_OPENAI_MODEL:gpt-4.1-mini}

app.ai.hair.openai-system-prompt=${AI_HAIR_OPENAI_SYSTEM_PROMPT:You are a hair analysis assistant for a salon recommendation system. Analyze the user's hair image and return JSON only with these keys: faceShape, hairTexture, hairLength, hairDensity, currentStyle, confidence. Allowed values: faceShape=oval, round, square, heart, diamond, rectangle, triangle, oblong, unknown; hairTexture=straight, wavy, curly, coily, fine, thick, unknown; hairLength=short, medium, long, very_long, unknown; hairDensity=low, medium, high, unknown. currentStyle should be a short descriptive label or unknown. confidence must be a number from 0 to 1. If uncertain, use unknown. Do not add any extra keys or explanation.}

app.ai.hair.api-key=${HAIR_AI_API_KEY}

app.ai.hair.max-output-tokens=${AI_HAIR_MAX_OUTPUT_TOKENS:500}
app.ai.hair.temperature=${AI_HAIR_TEMPERATURE:0.0}


# ============================================================
# AI - SERVICE DESCRIPTION
# ============================================================
app.ai.service-description.enabled=${AI_SERVICE_DESCRIPTION_ENABLED:true}

app.ai.service-description.provider=${AI_SERVICE_DESCRIPTION_PROVIDER:openai}

app.ai.service-description.openai-model=${AI_SERVICE_DESCRIPTION_OPENAI_MODEL:gpt-4o}

app.ai.service-description.openai-system-prompt=${AI_SERVICE_DESCRIPTION_OPENAI_SYSTEM_PROMPT:You are a professional salon copywriter. Write a Vietnamese service description that is SEO-friendly, natural, and suitable for spa/salon customers. Requirements: length must be between 100 and 150 words. Use the provided service name and keywords naturally. Keep the tone elegant, trustworthy, and customer-friendly. Do not use bullet points unless explicitly asked. Do not add markdown, title, or explanation. Return only the final description text.}

app.ai.service-description.min-words=${AI_SERVICE_DESCRIPTION_MIN_WORDS:100}
app.ai.service-description.max-words=${AI_SERVICE_DESCRIPTION_MAX_WORDS:150}

app.ai.service-description.max-output-tokens=${AI_SERVICE_DESCRIPTION_MAX_OUTPUT_TOKENS:300}
app.ai.service-description.temperature=${AI_SERVICE_DESCRIPTION_TEMPERATURE:0.7}
app.ai.service-description.daily-quota-per-salon=${AI_SERVICE_DESCRIPTION_DAILY_QUOTA_PER_SALON:10}


# ============================================================
# AI - CHATBOT
# ============================================================
app.ai.chatbot.enabled=${AI_CHATBOT_ENABLED:true}
app.ai.chatbot.model=${AI_CHATBOT_MODEL:gpt-4o-mini}
app.ai.chatbot.max-fallback-attempts=${AI_CHATBOT_MAX_FALLBACK:3}


# ============================================================
# AI - REVENUE FORECAST SERVICE
# ============================================================
app.forecast.base-url=${FORECAST_SERVICE_BASE_URL:http://localhost:8001}

app.forecast.interval-width=${FORECAST_INTERVAL_WIDTH:0.8}
app.forecast.timeout-seconds=${FORECAST_TIMEOUT_SECONDS:60}
app.forecast.min-data-points=${FORECAST_MIN_DATA_POINTS:30}
app.forecast.retrain-months=${FORECAST_RETRAIN_MONTHS:6}
app.forecast.retrain-cron=${FORECAST_RETRAIN_CRON:0 0 2 1 * *}


# ============================================================
# HAIR STYLE IMPORT
# ============================================================
app.hair-style-import.enabled=${HAIR_STYLE_IMPORT_ENABLED:false}

app.hair-style-import.man-zip-path=${HAIR_STYLE_MAN_ZIP_PATH:classpath:ai/hairstyle_man.zip}

app.hair-style-import.women-zip-path=${HAIR_STYLE_WOMEN_ZIP_PATH:classpath:ai/hairstyle_women.zip}

app.hair-style-import.object-prefix=${HAIR_STYLE_OBJECT_PREFIX:hair-styles}


# ============================================================
# SENTRY
# ============================================================
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.release=${SENTRY_RELEASE:salonflow-be@1.0.0}

sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}

sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:false}

sentry.exception-resolver-order=${SENTRY_EXCEPTION_RESOLVER_ORDER:-2147483647}


# ============================================================
# ACTUATOR / PROMETHEUS
# ============================================================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,metrics,prometheus}

management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}

management.health.elasticsearch.enabled=${MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED:false}

management.endpoint.prometheus.enabled=${MANAGEMENT_PROMETHEUS_ENABLED:true}

management.metrics.export.prometheus.enabled=${MANAGEMENT_PROMETHEUS_EXPORT_ENABLED:true}

management.metrics.tags.application=${MANAGEMENT_METRICS_APPLICATION:salonflow}

management.metrics.distribution.percentiles-histogram.http.server.requests=${MANAGEMENT_HTTP_HISTOGRAM:true}

management.metrics.distribution.sla.http.server.requests=${MANAGEMENT_HTTP_SLA:500ms,1000ms,2000ms,5000ms}

management.metrics.distribution.percentiles.http.server.requests=${MANAGEMENT_HTTP_PERCENTILES:0.5,0.9,0.95,0.99}

management.metrics.distribution.percentiles-histogram.jdbc=${MANAGEMENT_JDBC_HISTOGRAM:true}

management.metrics.distribution.sla.jdbc=${MANAGEMENT_JDBC_SLA:50ms,100ms,250ms,500ms,1000ms}


# ============================================================
# REALTIME ALERTING - SLACK / EMAIL
# ============================================================
app.monitoring.slack.webhook-url=${SLACK_WEBHOOK_URL:}

app.monitoring.slack.enabled=${SLACK_ALERT_ENABLED:true}

app.monitoring.alert.email-to=${ALERT_EMAIL_TO:}

app.monitoring.alert.latency-threshold-ms=${ALERT_LATENCY_THRESHOLD_MS:2000}

app.monitoring.alert.error-rate-threshold-percent=${ALERT_ERROR_RATE_THRESHOLD_PERCENT:1.0}