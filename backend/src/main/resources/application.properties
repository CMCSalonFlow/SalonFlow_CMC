# AI
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:openai}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.default-model=${AI_DEFAULT_MODEL:gpt-4.1-mini}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:800}
app.ai.temperature=${AI_TEMPERATURE:0.3}
app.ai.rag-top-k=${AI_RAG_TOP_K:5}
app.ai.conversation-ttl-minutes=${AI_CONVERSATION_TTL_MINUTES:1440}
app.ai.review.enabled=${AI_REVIEW_ENABLED:true}
app.ai.review.provider=${AI_REVIEW_PROVIDER:openai}
app.ai.review.openai-model=${AI_REVIEW_OPENAI_MODEL:gpt-4.1-mini}
app.ai.review.openai-system-prompt=${AI_REVIEW_OPENAI_SYSTEM_PROMPT:You are a sentiment classifier for salon reviews. Classify the given review into exactly one of: positive, neutral, negative. Return JSON only with keys sentiment and confidence. sentiment must be lowercase. confidence must be a number between 0 and 1.}
app.ai.review.hugging-face-model=${AI_REVIEW_HF_MODEL:cardiffnlp/twitter-roberta-base-sentiment-latest}
app.ai.review.hugging-face-api-key=${AI_REVIEW_HF_API_KEY:}
app.ai.review.batch-size=${AI_REVIEW_BATCH_SIZE:20}
app.ai.review.scan-interval-ms=${AI_REVIEW_SCAN_INTERVAL_MS:1800000}
app.ai.review.low-confidence-threshold=${AI_REVIEW_LOW_CONFIDENCE_THRESHOLD:0.55}

app.ai.hair.enabled=${AI_HAIR_ENABLED:true}
app.ai.hair.provider=${AI_HAIR_PROVIDER:openai}
app.ai.hair.openai-model=${AI_HAIR_OPENAI_MODEL:gpt-4.1-mini}
app.ai.hair.openai-system-prompt=${AI_HAIR_OPENAI_SYSTEM_PROMPT:You are a hair analysis assistant for a salon recommendation system. Analyze the user's hair image and return JSON only with these keys: faceShape, hairTexture, hairLength, hairDensity, currentStyle, confidence. Allowed values: faceShape=oval, round, square, heart, diamond, rectangle, triangle, oblong, unknown; hairTexture=straight, wavy, curly, coily, fine, thick, unknown; hairLength=short, medium, long, very_long, unknown; hairDensity=low, medium, high, unknown. currentStyle should be a short descriptive label or unknown. confidence must be a number from 0 to 1. If uncertain, use unknown. Do not add any extra keys or explanation.}
app.ai.hair.api-key=${HAIR_AI_API_KEY}
app.ai.hair.max-output-tokens=${AI_HAIR_MAX_OUTPUT_TOKENS:500}
app.ai.hair.temperature=${AI_HAIR_TEMPERATURE:0.0}

app.ai.service-description.enabled=${AI_SERVICE_DESCRIPTION_ENABLED:true}
app.ai.service-description.provider=${AI_SERVICE_DESCRIPTION_PROVIDER:openai}
app.ai.service-description.openai-model=${AI_SERVICE_DESCRIPTION_OPENAI_MODEL:gpt-4o}
app.ai.service-description.openai-system-prompt=${AI_SERVICE_DESCRIPTION_OPENAI_SYSTEM_PROMPT:You are a professional salon copywriter. Write a Vietnamese service description that is SEO-friendly, natural, and suitable for spa/salon customers. Requirements: length must be between 100 and 150 words. Use the provided service name and keywords naturally. Keep the tone elegant, trustworthy, and customer-friendly. Do not use bullet points unless explicitly asked. Do not add markdown, title, or explanation. Return only the final description text.}
app.ai.service-description.min-words=${AI_SERVICE_DESCRIPTION_MIN_WORDS:100}
app.ai.service-description.max-words=${AI_SERVICE_DESCRIPTION_MAX_WORDS:150}
app.ai.service-description.max-output-tokens=${AI_SERVICE_DESCRIPTION_MAX_OUTPUT_TOKENS:300}
app.ai.service-description.temperature=${AI_SERVICE_DESCRIPTION_TEMPERATURE:0.7}
app.ai.service-description.daily-quota-per-salon=${AI_SERVICE_DESCRIPTION_DAILY_QUOTA_PER_SALON:10}

# REVENUE FORECAST SERVICE
app.forecast.base-url=${FORECAST_SERVICE_BASE_URL:http://localhost:8001}
app.forecast.interval-width=${FORECAST_INTERVAL_WIDTH:0.8}
app.forecast.timeout-seconds=${FORECAST_TIMEOUT_SECONDS:60}
app.forecast.min-data-points=${FORECAST_MIN_DATA_POINTS:30}
app.forecast.retrain-months=${FORECAST_RETRAIN_MONTHS:6}
app.forecast.retrain-cron=${FORECAST_RETRAIN_CRON:0 0 2 1 * *}

# HAIR STYLE IMPORT TOOL
app.hair-style-import.enabled=${HAIR_STYLE_IMPORT_ENABLED:false}
app.hair-style-import.man-zip-path=${HAIR_STYLE_MAN_ZIP_PATH:}
app.hair-style-import.women-zip-path=${HAIR_STYLE_WOMEN_ZIP_PATH:}
app.hair-style-import.object-prefix=${HAIR_STYLE_OBJECT_PREFIX:hair-styles}
