spring.datasource.url=jdbc:h2:mem:salonflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# OAuth2 mock
GOOGLE_CLIENT_ID=test-google-client-id
GOOGLE_CLIENT_SECRET=test-google-client-secret
FACEBOOK_CLIENT_ID=test-facebook-client-id
FACEBOOK_CLIENT_SECRET=test-facebook-client-secret
RESEND_API_KEY=test-resend-api-key
RESEND_FROM=test-resend-from
SENDGRID_API_KEY=test-sendgrid-api-key
SENDGRID_FROM=test-sendgrid-from
app.notification.email.enabled=true
mail.primary-provider=resend
mail.fallback-provider=sendgrid
mail.max-retries=3

# Redis embedded (it.ozimov:embedded-redis) dùng port riêng tránh xung đột
spring.data.redis.host=localhost
spring.data.redis.port=6370
