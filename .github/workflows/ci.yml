name: SalonFlow Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  unit-tests-and-build:
    name: Run Unit Tests & Build Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Execute All Backend Unit Tests
        run: ./mvnw test

      - name: Compile and Package JAR
        run: ./mvnw package -DskipTests

      - name: Verify JAR Artifact
        run: ls -la target/*.jar

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  docker-smoke-test:
    name: Docker Containerization Smoke Test
    needs: unit-tests-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Test Docker Compose Infrastructure
        run: |
          docker compose up -d
          docker ps
          docker compose down