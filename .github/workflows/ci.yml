name: SalonFlow Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  build-and-test:
    name: Build & Package Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Compile and Package Application
        run: ./mvnw clean package -DskipTests

      - name: Verify Artifact Creation
        run: ls -la target/*.jar

  docker-smoke-test:
    name: Docker Containerization Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Test Docker Compose Infrastructure
        run: |
          docker compose up -d
          docker ps
          docker compose down