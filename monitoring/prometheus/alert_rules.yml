groups:
  - name: salonflow_alert_rules
    rules:
      - alert: HighRequestLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[1m])) by (le)) > 2
        for: 30s
        labels:
          severity: warning
          service: salonflow-api
        annotations:
          summary: "API Request Latency p95 > 2s"
          description: "Độ trễ phản hồi p95 của SalonFlow API vượt quá 2 giây trong 30 giây qua (Hiện tại: {{ $value }}s)."
          action: "Gửi cảnh báo tức thì tới kênh Slack và Email quản trị viên."

      - alert: HighHttpErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) / sum(rate(http_server_requests_seconds_count[1m]))) * 100 > 1
        for: 30s
        labels:
          severity: critical
          service: salonflow-api
        annotations:
          summary: "API Error Rate > 1%"
          description: "Tỷ lệ lỗi HTTP 5xx của hệ thống vượt quá 1% trong 1 phút qua (Hiện tại: {{ $value }}%)."
          action: "Gửi cảnh báo khẩn cấp tới Slack Webhook và Email admin."

      - alert: DatabaseConnectionPoolHigh
        expr: hikaricp_connections_pending > 5
        for: 30s
        labels:
          severity: warning
          service: salonflow-database
        annotations:
          summary: "HikariCP Connection Pool Saturation"
          description: "Có hơn 5 kết nối đang phải chờ trong hàng đợi kết nối cơ sở dữ liệu PostgreSQL."
